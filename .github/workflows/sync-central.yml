name: sync-central
# This webapp's own data store. worker/central.js holds only the central-catalogue fields the blog posts cite (id, kind,
# title, date, status, page) for the record IDs cited in worker/data.js, pulled read-only from the central catalogue by
# tools/sync_central.py. It is derived: never edited by hand. It reaches visitors only when the Worker is next deployed with it. Every 6 hours and on demand; never force-pushes.
# - Sion's Tab agent
on:
  schedule:
    - cron: '35 5-23/6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-central
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - name: Pull the fields this webapp needs from the central catalogue
        run: python3 tools/sync_central.py
      - name: Commit when something changed
        run: |
          git add worker/central.js
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="cedwyn-central-sync" -c user.email="actions@users.noreply.github.com" commit -q -m "worker/central.js: sync from the central catalogue"
          git push origin HEAD:main
